name: Build run-mcp Binary

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'cmd/run-mcp/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-run-mcp.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cmd/run-mcp/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/build-run-mcp.yml'
  release:
    types: [ published ]
  workflow_dispatch:

env:
  GO_VERSION: '1.21'

jobs:
  build:
    name: Build run-mcp
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Windows
          - goos: windows
            goarch: amd64
            suffix: .exe
          
          # macOS
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          
          # Linux
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: go mod download

      - name: Set build variables
        id: vars
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "binary_name=run-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ steps.vars.outputs.version }} -X main.commit=${{ steps.vars.outputs.commit }} -X main.date=${{ steps.vars.outputs.date }}" \
            -o ${{ steps.vars.outputs.binary_name }} \
            ./cmd/run-mcp

      - name: Test binary (non-Windows)
        if: matrix.goos != 'windows'
        run: |
          chmod +x ${{ steps.vars.outputs.binary_name }}
          ./${{ steps.vars.outputs.binary_name }} --version
          ./${{ steps.vars.outputs.binary_name }} --help

      - name: Generate checksums
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ steps.vars.outputs.binary_name }} > ${{ steps.vars.outputs.binary_name }}.sha256
          else
            shasum -a 256 ${{ steps.vars.outputs.binary_name }} > ${{ steps.vars.outputs.binary_name }}.sha256
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: run-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.vars.outputs.binary_name }}
            ${{ steps.vars.outputs.binary_name }}.sha256
          retention-days: 30

  test:
    name: Test run-mcp
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: run-mcp-linux-amd64
          path: .

      - name: Test binary functionality
        run: |
          chmod +x run-mcp-linux-amd64
          
          # Test basic commands
          ./run-mcp-linux-amd64 --version
          ./run-mcp-linux-amd64 --help
          ./run-mcp-linux-amd64 info
          ./run-mcp-linux-amd64 config
          
          # Test error handling
          if ./run-mcp-linux-amd64 invalid-command 2>/dev/null; then
            echo "ERROR: Should have failed on invalid command"
            exit 1
          fi
          
          echo "✓ All tests passed"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'release'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          
          # Move and rename binaries
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/* release/
            fi
          done
          
          # List all files for verification
          ls -la release/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-test:
    name: Test with Docker
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: run-mcp-linux-amd64
          path: .

      - name: Test with Docker
        run: |
          chmod +x run-mcp-linux-amd64
          
          # Test that Docker is detected
          ./run-mcp-linux-amd64 info | grep -q "docker"
          
          # Test configuration
          ./run-mcp-linux-amd64 config | grep -q "Node.js Image"
          ./run-mcp-linux-amd64 config | grep -q "Python Image"
          
          echo "✓ Docker integration tests passed"