name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      update_changelog:
        description: 'Update CHANGELOG.md'
        required: false
        type: boolean
        default: true

env:
  GO_VERSION: '1.21'

jobs:
  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    if: github.event.inputs.update_changelog == 'true'
    
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Generate and update changelog
        run: |
          # Determine version
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION=${VERSION#v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          
          echo "Updating changelog for version: $VERSION"
          
          # Make script executable
          chmod +x scripts/generate-changelog.sh
          
          # Generate new changelog entry
          TEMP_FILE=$(mktemp)
          echo "# Changelog" > "$TEMP_FILE"
          echo "" >> "$TEMP_FILE"
          echo "All notable changes to this project will be documented in this file." >> "$TEMP_FILE"
          echo "" >> "$TEMP_FILE"
          echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)," >> "$TEMP_FILE"
          echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)." >> "$TEMP_FILE"
          echo "" >> "$TEMP_FILE"
          
          # Add new version entry
          bash scripts/generate-changelog.sh "$VERSION" >> "$TEMP_FILE"
          echo "" >> "$TEMP_FILE"
          
          # Append existing changelog (skip header)
          if [ -f "CHANGELOG.md" ]; then
            tail -n +8 CHANGELOG.md >> "$TEMP_FILE"
          fi
          
          # Replace changelog
          mv "$TEMP_FILE" CHANGELOG.md
          
          echo "✅ Changelog updated"
      
      - name: Commit changelog changes
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changes to commit"
          else
            git add CHANGELOG.md
            if [ "${{ github.event_name }}" = "release" ]; then
              VERSION="${{ github.event.release.tag_name }}"
            else
              VERSION="${{ github.event.inputs.version }}"
            fi
            git commit -m "docs: update changelog for ${VERSION}"
            git push origin ${{ github.ref_name }}
            echo "✅ Changelog committed and pushed"
          fi

  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: [update-changelog]
    if: always() && (needs.update-changelog.result == 'success' || needs.update-changelog.result == 'skipped')
    
    permissions:
      contents: write
      packages: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build all binaries
        run: make build-run-mcp-all
      
      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: run-mcp-binaries
          path: build/run-mcp-*
      
      # Temporarily disabled - containers should be built separately via build-containers workflow
      # - name: Build and push containers
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: |
      #     # Run complete container lifecycle
      #     make containers
      #     
      #     # Also build matrix versions for releases
      #     if [ "${{ github.event_name }}" = "release" ]; then
      #       make containers-matrix
      #     fi
      
      - name: Create release assets
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          # Create release notes from changelog
          if [ -f "CHANGELOG.md" ]; then
            # Extract release notes for this version
            awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
          else
            echo "Release $VERSION" > release-notes.md
            echo "" >> release-notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release-notes.md
          fi
      
      - name: Upload release assets (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Release v${{ github.event.inputs.version }}
          body_path: release-notes.md
          files: build/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload release assets (release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-release:
    name: Test Release Assets
    runs-on: ${{ matrix.os }}
    needs: [build-and-release]
    if: always() && needs.build-and-release.result == 'success'
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            binary: run-mcp-linux-amd64
          - os: macos-latest
            platform: darwin-amd64
            binary: run-mcp-darwin-amd64
          - os: macos-latest
            platform: darwin-arm64
            binary: run-mcp-darwin-arm64
    
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: run-mcp-binaries
          path: build/
      
      - name: Test binary (Unix)
        run: |
          BINARY="build/${{ matrix.binary }}"
          if [ -f "$BINARY" ]; then
            chmod +x "$BINARY"
            "$BINARY" --version
            "$BINARY" --help
            echo "✅ Binary test passed for ${{ matrix.platform }}"
          else
            echo "❌ Binary not found: $BINARY"
            exit 1
          fi
      
      - name: Test basic commands
        run: |
          BINARY="build/${{ matrix.binary }}"
          "$BINARY" info || echo "Info command may fail without container runtime"
          "$BINARY" config || echo "Config command may fail without container runtime"

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [build-and-release]
    if: always() && needs.build-and-release.result == 'success'
    
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: serverless-dna/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap
      
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: run-mcp-binaries
          path: build/
      
      - name: Update formula
        run: |
          # Determine version
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="v${{ github.event.inputs.version }}"
          fi
          # Remove 'v' prefix for homebrew version (homebrew versions are just numbers)
          HOMEBREW_VERSION=${VERSION#v}
          
          echo "=== Debug: Current directory and files ==="
          pwd
          ls -la
          echo ""
          echo "=== Debug: Checking for Makefile ==="
          if [ -f "Makefile" ]; then
            echo "✅ Makefile found"
            echo "Checking for update-homebrew-github target..."
            grep -n "update-homebrew-github:" Makefile || echo "❌ Target not found in Makefile"
          else
            echo "❌ Makefile not found"
          fi
          echo ""
          echo "=== Debug: Checking for script ==="
          ls -la scripts/update-homebrew-formula-github.sh || echo "❌ Script not found"
          echo ""
          
          echo "Updating homebrew formula for version: $HOMEBREW_VERSION (from tag: $VERSION)"
          
          # Use the makefile target to update the formula
          make update-homebrew-github VERSION="$HOMEBREW_VERSION" TAG="$VERSION"
      
      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # Determine version for commit message
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="v${{ github.event.inputs.version }}"
          fi
          
          git add Formula/run-mcp.rb
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update run-mcp to ${VERSION}"
            git push
            echo "✅ Formula committed and pushed"
          fi