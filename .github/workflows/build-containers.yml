name: Build Container Images

on:
  push:
    branches: [main]
    paths:
      - 'nodejs/**'
      - 'python/**'
      - 'scripts/**'
      - '.github/workflows/build-containers.yml'
      - 'Dockerfile*'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths:
      - 'nodejs/**'
      - 'python/**'
      - 'scripts/**'
      - '.github/workflows/build-containers.yml'
      - 'Dockerfile*'
      - 'Makefile'
  workflow_dispatch:
    inputs:
      build_matrix:
        description: 'Build all supported versions (matrix build)'
        required: false
        default: 'false'
        type: boolean
      force_build:
        description: 'Force build all containers'
        required: false
        default: 'false'
        type: boolean
      build_reason:
        description: 'Reason for build (for logging)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Run CI checks
        run: make ci

  cleanup-old-versions:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Cleanup old versions before building new ones
        run: make cleanup-versions
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [ci, cleanup-old-versions]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push containers
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event.inputs.build_matrix }}" == "true" ]]; then
            echo "Running complete container lifecycle with matrix builds AND latest tags"
            make containers-matrix
            make containers
          else
            echo "Running complete container lifecycle with latest versions"
            make containers
          fi

  build-binary:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build run-mcp binary
        run: make build-run-mcp-all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: run-mcp-binaries
          path: build/run-mcp-*
          retention-days: 30