name: Update Winget Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., 1.0.0)'
        required: true
        type: string
      tag:
        description: 'Git tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  GO_VERSION: '1.21'

jobs:
  update-winget:
    name: Update Winget Package
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: read
      pull-requests: write
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Checkout winget-pkgs repository
        uses: actions/checkout@v4
        with:
          repository: serverless-dna/winget-pkgs
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}
          path: winget-pkgs
      
      - name: Download release artifacts from GitHub
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.tag }}"
          
          echo "Downloading Windows release artifacts for $TAG..."
          mkdir -p build
          
          # Download Windows binary (only need Windows for winget)
          curl -L -f -o build/run-mcp-windows-amd64.exe "https://github.com/modelcontextprotocol/mcp-container-images/releases/download/$TAG/run-mcp-windows-amd64.exe"
          
          echo "✅ Downloaded Windows release artifact"
          ls -la build/
      
      - name: Update winget manifest using Makefile
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.tag }}"
          
          echo "Updating winget manifest for version: $VERSION (from tag: $TAG)"
          make update-winget-github VERSION="$VERSION" TAG="$TAG"
      
      - name: Commit and push manifest
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          cd winget-pkgs
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          VERSION="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.tag }}"
          
          git add manifests/s/ServerlessDNA/RunMCP/$VERSION/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add ServerlessDNA.RunMCP version $VERSION"
            git push
            echo "✅ Winget manifest committed and pushed"
          fi